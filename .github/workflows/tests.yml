name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m src.experiments --config configs/rq1.yaml --output smoke-results --smoke
      - run: python -c "import pandas as pd; r=pd.read_csv('smoke-results/runs.csv'); assert set(r.arm)=={'no_fe','selection','construction','combined'}; assert set(r.loc[r.arm!='no_fe','candidate_evaluations'])=={40}"
