name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_milestone1.py test_milestone2.py
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('IAinspoBIO_upgraded.ipynb', as_version=4))"
      - run: python benchmark.py --smoke --output smoke-results
      - run: python -c "import pandas as pd; r=pd.read_csv('smoke-results/raw_results.csv'); assert len(r)==36; assert set(r.loc[r.fitness_evaluations>0,'fitness_evaluations'])=={1000}"
      - run: python replay_diagnostics.py smoke-results
      - run: python benchmark_continuous.py --smoke --budget 80 --output smoke-milestone2
      - run: python -c "import pandas as pd; r=pd.read_csv('smoke-milestone2/raw_results.csv'); assert len(r)==10; assert set(r.fitness_evaluations)=={80}; assert set(r.method)=={'GA','PSO','ES','DE','CMA-ES'}"
